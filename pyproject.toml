[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bonhase-shotvalue"
version = "0.1.0"
description = "通过字符级与结构级特征识别表格截图的数值还原的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bonhase" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bonhase.github.io"
Repository = "https://github.com/bonhase/shotvalue"
Issues = "https://github.com/bonhase/shotvalue/issues"

[project.scripts]
shotvalue = "shotvalue:main"

[tool.setuptools]
py-modules = ["shotvalue"]
